<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sumic — The Listening Room</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="logo_app_icon.svg">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="card-nav.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "postprocessing": "https://unpkg.com/postprocessing@6.33.5/build/postprocessing.esm.js"
      }
    }
  </script>
</head>
<body>
  <div class="auth-shell" id="authShell">
    <div class="dither-container" id="ditherBg"></div>
    
    <div class="auth-split-container">
      <!-- Left side: Login card -->
      <div class="auth-left-pane">
        <div class="auth-card">
          <div class="auth-brand" style="display: flex; flex-direction: column; align-items: flex-start; text-align: left; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: flex-start; gap: 14px; margin-bottom: 8px;">
              <div class="brand-logo sumic-logo-container" style="width: 52px; height: 52px; flex-shrink: 0; background: var(--sumic-graphite); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--sumic-line);">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;">
                  <path d="M 30.909,30.909 A 27,27 0 0,1 69.091,30.909" fill="none" stroke="#F4F2EC" stroke-width="13" stroke-linecap="round" />
                  <path d="M 76.080,43.012 A 27,27 0 0,1 56.988,76.080" fill="none" stroke="#F4F2EC" stroke-width="13" stroke-linecap="round" />
                  <path d="M 43.012,76.080 A 27,27 0 0,1 23.920,43.012" fill="none" stroke="#F4F2EC" stroke-width="13" stroke-linecap="round" />
                </svg>
              </div>
              <div class="brand-title" style="margin: 0; font-size: 1.4rem;"><span>SU</span>MIC</div>
            </div>
            <div class="brand-sub">music, redefined</div>
          </div>
          <div class="home-apk-ad" id="loginApkAd">
            <img src="logo_app_icon.svg" alt="Sumic" />
            <div class="home-apk-ad-info">
              <div class="apk-ad-title">Download Android App</div>
              <div class="apk-ad-sub">by Saurabh222007</div>
            </div>
            <a id="apkDownloadBtn" class="apk-download-btn" href="#" target="_blank">
              <i class="fas fa-download"></i> Get APK
            </a>
          </div>
          <h2>Enter the listening room.</h2>
          <p>Keep your listening close. Use your name and email, or enter directly as a guest.</p>
          <form class="auth-form" id="loginForm">
            <label for="userName">Name</label>
            <input id="userName" name="name" type="text" placeholder="Curator" autocomplete="name">
            <label for="userEmail">Email</label>
            <input id="userEmail" name="email" type="email" placeholder="curator@sumic.audio" autocomplete="email">
            <div class="auth-actions">
              <button class="auth-btn primary" type="submit">Enter Room</button>
              <button class="auth-btn secondary" id="guestBtn" type="button">Continue as guest</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right side: Animated promo texts (TrueFocus + ScrambledText) -->
      <div class="auth-right-pane">
        <div class="auth-promo-card">
          <div id="trueFocusContainer"></div>
          <div id="scrambledTextContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
  <script type="module">
    import { initDither } from './dither-bg.js';
    const ditherContainer = document.getElementById('ditherBg');
    if (ditherContainer) {
      window.sumicDither = initDither(ditherContainer, {
        waveSpeed: 0.04,
        waveFrequency: 2.5,
        waveAmplitude: 0.3,
        waveColor: [0.12, 0.12, 0.12], // Quiet monochrome graphite wave
        colorNum: 4,
        pixelSize: 2,
        enableMouseInteraction: true,
        mouseRadius: 1
      });
    }
  </script>
</body>
</html>
